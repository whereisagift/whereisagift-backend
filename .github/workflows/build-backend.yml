name: Build and Push Java to GHCR

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/whereisagift/whereisagift-backend
          tags: |
            type=sha,prefix=${{ github.ref_name == 'main' && 'production' || 'develop' }}-,
            ${{ github.ref_name == 'main' && 'production' || 'develop' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-to: type=gha,mode=max
          cache-from: type=gha

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    steps:
      - name: Trigger application deployment
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.DOKPLOY_TRIGGER_API }}
          method: POST
          customHeaders: |
            {"x-api-key":"${{ secrets.DOKPLOY_TOKEN }}"}
          data: |
            {"applicationId":"${{ secrets.DOKPLOY_APP_ID }}"}
